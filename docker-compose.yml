services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "3100:3100"
    env_file:
      - apps/web/.env
    environment:
      MATCHER_API_URL: http://matcher-api:8000
      MATCHER_API_TOKEN: local-development-only
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - web_next:/workspace/apps/web/.next
    depends_on:
      matcher-api:
        condition: service_healthy

  matcher-api:
    build:
      context: .
      dockerfile: apps/matcher-api/Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      HOST: 0.0.0.0
      MATCHER_API_TOKEN: local-development-only
    volumes:
      - ./apps/matcher-api:/app
    command: ["python", "dev.py"]

volumes:
  node_modules:
  web_next:
