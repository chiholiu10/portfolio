name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  changes:
    name: Detect affected systems
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      web: ${{ steps.scope.outputs.web }}
      matcher: ${{ steps.scope.outputs.matcher }}
      runtime: ${{ steps.scope.outputs.runtime }}
      code: ${{ steps.scope.outputs.code }}
      summary: ${{ steps.scope.outputs.summary }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          web=false
          matcher=false
          runtime=false
          code=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed_files="__all__"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            changed_files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          elif [ -n "$BEFORE_SHA" ] && ! printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            changed_files="$(git diff --name-only "$BEFORE_SHA...HEAD")"
          else
            changed_files="__all__"
          fi

          while IFS= read -r file; do
            case "$file" in
              __all__)
                web=true
                matcher=true
                runtime=true
                code=true
                ;;
              apps/web/*|packages/*|package.json|yarn.lock|eslint.config.mjs|.prettierrc.json|scripts/prettier-styles-plugin.*)
                web=true
                code=true
                ;;
              apps/matcher-api/*|evaluation/*|scripts/evaluate-matcher*|scripts/migrate-matcher-evidence.mjs)
                matcher=true
                code=true
                ;;
              docker-compose*.yml|*/Dockerfile|scripts/test-matcher-docker.mjs|scripts/dev/docker.mjs)
                runtime=true
                code=true
                ;;
              .github/workflows/*|scripts/*)
                web=true
                matcher=true
                runtime=true
                code=true
                ;;
            esac
          done <<< "$changed_files"

          summary="web=$web, matcher=$matcher, runtime=$runtime, security=$code"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "matcher=$matcher" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          printf '### Change scope\n\n`%s`\n' "$summary" >> "$GITHUB_STEP_SUMMARY"

  repository:
    name: Repository integrity
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Reject whitespace errors
        run: git diff --check HEAD^

      - name: Record selected scope
        run: echo '${{ needs.changes.outputs.summary }}' >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web quality
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check formatting
        run: yarn test:format && yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test --runInBand --ci

      - name: Build production bundle
        env:
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID || 'z1tccslo5ojo' }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || 'master' }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: yarn build

  matcher:
    name: Matcher correctness and evaluation
    needs: changes
    if: needs.changes.outputs.matcher == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install workspace dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/matcher-api/requirements-test.txt

      - name: Install Python dependencies
        run: yarn setup:python

      - name: Test Python matcher
        run: yarn test:python

      - name: Evaluate matcher quality
        run: yarn eval:matcher:check

  runtime:
    name: Container smoke and recovery
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Test Docker startup and crash recovery
        run: yarn test:docker

  security:
    name: Security (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze source
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          category: /language:${{ matrix.language }}

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [changes, repository, web, matcher, runtime, security]
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Publish final decision
        env:
          CHANGES: ${{ needs.changes.result }}
          REPOSITORY: ${{ needs.repository.result }}
          WEB: ${{ needs.web.result }}
          MATCHER: ${{ needs.matcher.result }}
          RUNTIME: ${{ needs.runtime.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          failed=false
          {
            echo '## Quality Gate'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Change detection | $CHANGES |"
            echo "| Repository integrity | $REPOSITORY |"
            echo "| Web quality | $WEB |"
            echo "| Matcher correctness | $MATCHER |"
            echo "| Container recovery | $RUNTIME |"
            echo "| CodeQL security | $SECURITY |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$CHANGES" "$REPOSITORY" "$WEB" "$MATCHER" "$RUNTIME" "$SECURITY"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              failed=true
            fi
          done

          if [ "$failed" = true ]; then
            echo '### Decision: review required' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo '### Decision: ready to merge' >> "$GITHUB_STEP_SUMMARY"
