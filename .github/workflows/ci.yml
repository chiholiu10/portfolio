name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  changes:
    name: Detect affected systems
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      web: ${{ steps.scope.outputs.web }}
      matcher: ${{ steps.scope.outputs.matcher }}
      runtime: ${{ steps.scope.outputs.runtime }}
      code: ${{ steps.scope.outputs.code }}
      summary: ${{ steps.scope.outputs.summary }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          web=false
          matcher=false
          runtime=false
          code=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed_files="__all__"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            changed_files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          elif [ -n "$BEFORE_SHA" ] && ! printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            changed_files="$(git diff --name-only "$BEFORE_SHA...HEAD")"
          else
            changed_files="__all__"
          fi

          while IFS= read -r file; do
            case "$file" in
              __all__)
                web=true
                matcher=true
                runtime=true
                code=true
                ;;
              apps/web/*|packages/*|package.json|yarn.lock|vercel.json|eslint.config.mjs|.prettierrc.json|sonar-project.properties|scripts/prettier-styles-plugin.*)
                web=true
                code=true
                ;;
              apps/matcher-api/*|evaluation/*|scripts/evaluate-matcher*|scripts/migrate-matcher-evidence.mjs)
                matcher=true
                code=true
                ;;
              docker-compose*.yml|*/Dockerfile|scripts/test-matcher-docker.mjs|scripts/dev/docker.mjs)
                runtime=true
                code=true
                ;;
              .github/workflows/*|scripts/*)
                web=true
                matcher=true
                runtime=true
                code=true
                ;;
            esac
          done <<< "$changed_files"

          summary="web=$web, matcher=$matcher, runtime=$runtime, security=$code"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "matcher=$matcher" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          printf '### Change scope\n\n`%s`\n' "$summary" >> "$GITHUB_STEP_SUMMARY"

  repository:
    name: Repository integrity
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Reject whitespace errors
        run: git diff --check HEAD^

      - name: Record selected scope
        run: echo '${{ needs.changes.outputs.summary }}' >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web quality
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check formatting
        run: yarn test:format && yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test --runInBand --ci

      - name: Test security checks, including failure detection
        run: yarn test:security

      - name: Build production bundle
        env:
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID || 'z1tccslo5ojo' }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || 'master' }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: yarn build

  matcher:
    name: Matcher correctness and evaluation
    needs: changes
    if: needs.changes.outputs.matcher == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install workspace dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/matcher-api/requirements-test.txt

      - name: Install Python dependencies
        run: yarn setup:python

      - name: Test Python matcher
        run: yarn test:python

      - name: Evaluate matcher quality
        run: yarn eval:matcher:check

  runtime:
    name: Container smoke and recovery
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Test Docker startup and crash recovery
        run: yarn test:docker

  security:
    name: Security (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze source
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          category: /language:${{ matrix.language }}

  repository-security:
    name: Repository security baseline
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          skip-dirs: node_modules,apps/web/.next,apps/matcher-api/.venv

  container-security:
    name: Container security
    needs: changes
    if: >-
      needs.changes.outputs.matcher == 'true' ||
      needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build matcher image from reviewed source
        run: >-
          docker build
          --file apps/matcher-api/Dockerfile
          --tag portfolio-matcher:${{ github.sha }}
          .

      - name: Scan built image for known vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: portfolio-matcher:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

  sonarcloud:
    name: SonarCloud quality gate
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Validate SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          missing=0
          for variable in SONAR_TOKEN SONAR_PROJECT_KEY SONAR_ORGANIZATION; do
            if [ -z "${!variable}" ]; then
              echo "::error title=Missing SonarCloud configuration::$variable must be configured in the repository settings"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Generate JavaScript and TypeScript coverage
        run: yarn test --runInBand --ci --coverage

      - name: Analyze maintainability, reliability and security
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Reject newly introduced high-risk dependencies
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: high

  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      [
        changes,
        repository,
        web,
        matcher,
        runtime,
        security,
        repository-security,
        container-security,
        sonarcloud,
        dependency-review,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Publish final decision
        env:
          CHANGES: ${{ needs.changes.result }}
          REPOSITORY: ${{ needs.repository.result }}
          WEB: ${{ needs.web.result }}
          MATCHER: ${{ needs.matcher.result }}
          RUNTIME: ${{ needs.runtime.result }}
          SECURITY: ${{ needs.security.result }}
          REPOSITORY_SECURITY: ${{ needs.repository-security.result }}
          CONTAINER_SECURITY: ${{ needs.container-security.result }}
          SONARCLOUD: ${{ needs.sonarcloud.result }}
          DEPENDENCIES: ${{ needs.dependency-review.result }}
        run: |
          failed=false
          {
            echo '## Quality Gate'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Change detection | $CHANGES |"
            echo "| Repository integrity | $REPOSITORY |"
            echo "| Web quality | $WEB |"
            echo "| Matcher correctness | $MATCHER |"
            echo "| Container recovery | $RUNTIME |"
            echo "| CodeQL security | $SECURITY |"
            echo "| Repository security | $REPOSITORY_SECURITY |"
            echo "| Container security | $CONTAINER_SECURITY |"
            echo "| SonarCloud quality gate | $SONARCLOUD |"
            echo "| Dependency review | $DEPENDENCIES |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$CHANGES" "$REPOSITORY" "$WEB" "$MATCHER" "$RUNTIME" "$SECURITY" "$REPOSITORY_SECURITY" "$CONTAINER_SECURITY" "$SONARCLOUD" "$DEPENDENCIES"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              failed=true
            fi
          done

          if [ "$failed" = true ]; then
            echo '### Decision: review required' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo '### Decision: ready to merge' >> "$GITHUB_STEP_SUMMARY"
