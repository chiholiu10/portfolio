name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  changes:
    name: 1 · Detect affected systems
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      web: ${{ steps.scope.outputs.web }}
      matcher: ${{ steps.scope.outputs.matcher }}
      runtime: ${{ steps.scope.outputs.runtime }}
      code: ${{ steps.scope.outputs.code }}
      summary: ${{ steps.scope.outputs.summary }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          web=false
          matcher=false
          runtime=false
          code=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed_files="__all__"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            changed_files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          elif [ -n "$BEFORE_SHA" ] && ! printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            changed_files="$(git diff --name-only "$BEFORE_SHA...HEAD")"
          else
            changed_files="__all__"
          fi

          while IFS= read -r file; do
            case "$file" in
              __all__)
                web=true
                matcher=true
                runtime=true
                code=true
                ;;
              apps/web/*|packages/*|package.json|yarn.lock|vercel.json|eslint.config.mjs|.prettierrc.json|sonar-project.properties|scripts/prettier-styles-plugin.*)
                web=true
                code=true
                ;;
              apps/matcher-api/*|evaluation/*|scripts/evaluate-matcher*|scripts/migrate-matcher-evidence.mjs)
                matcher=true
                code=true
                ;;
              docker-compose*.yml|*/Dockerfile|scripts/test-matcher-docker.mjs|scripts/dev/docker.mjs)
                runtime=true
                code=true
                ;;
              .github/workflows/*|scripts/*)
                web=true
                matcher=true
                runtime=true
                code=true
                ;;
            esac
          done <<< "$changed_files"

          summary="web=$web, matcher=$matcher, runtime=$runtime, security=$code"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "matcher=$matcher" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          printf '### Change scope\n\n`%s`\n' "$summary" >> "$GITHUB_STEP_SUMMARY"

  repository:
    name: 2 · Repository integrity
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Reject whitespace errors
        run: git diff --check HEAD^

      - name: Record selected scope
        run: echo '${{ needs.changes.outputs.summary }}' >> "$GITHUB_STEP_SUMMARY"

  web:
    name: 3A · Web quality
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --ignore-scripts

      - name: Check formatting
        run: yarn test:format && yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test --runInBand --ci

      - name: Test security checks, including failure detection
        run: yarn test:security

      - name: Build production bundle
        env:
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID || 'z1tccslo5ojo' }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || 'master' }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: yarn build

  matcher:
    name: 3B · Matcher correctness
    needs: changes
    if: needs.changes.outputs.matcher == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install workspace dependencies
        run: yarn install --frozen-lockfile --non-interactive --ignore-scripts

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/matcher-api/requirements-test.txt

      - name: Install Python dependencies
        run: yarn setup:python

      - name: Test Python matcher
        run: yarn test:python

      - name: Evaluate matcher quality
        run: yarn eval:matcher:check

  runtime:
    name: 3C · Container resilience
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --ignore-scripts

      - name: Test Docker startup and crash recovery
        run: yarn test:docker

  security:
    name: 3D · CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze source
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  repository-security:
    name: 3E · Dependency and secret scan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          skip-dirs: node_modules,apps/web/.next,apps/matcher-api/.venv

  container-security:
    name: 3F · Container security
    needs: changes
    if: >-
      needs.changes.outputs.matcher == 'true' ||
      needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build matcher image from reviewed source
        run: >-
          docker build
          --file apps/matcher-api/Dockerfile
          --tag portfolio-matcher:${{ github.sha }}
          .

      - name: Scan built image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: portfolio-matcher:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

  sonarcloud:
    name: 3G · SonarCloud quality gate
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Validate SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          missing=0
          for variable in SONAR_TOKEN SONAR_PROJECT_KEY SONAR_ORGANIZATION; do
            if [ -z "${!variable}" ]; then
              echo "::error title=Missing SonarCloud configuration::$variable must be configured in the repository settings"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --ignore-scripts

      - name: Generate JavaScript and TypeScript coverage
        run: yarn test --runInBand --ci --coverage

      - name: Analyze maintainability, reliability and security
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  dependency-review:
    name: 3H · Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject newly introduced high-risk dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  quality-gate:
    name: 4 · CI quality gate
    if: always()
    needs:
      [
        changes,
        repository,
        web,
        matcher,
        runtime,
        security,
        repository-security,
        container-security,
        sonarcloud,
        dependency-review,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Publish final decision
        env:
          SCOPE: ${{ needs.changes.outputs.summary }}
          CHANGES: ${{ needs.changes.result }}
          REPOSITORY: ${{ needs.repository.result }}
          WEB: ${{ needs.web.result }}
          MATCHER: ${{ needs.matcher.result }}
          RUNTIME: ${{ needs.runtime.result }}
          SECURITY: ${{ needs.security.result }}
          REPOSITORY_SECURITY: ${{ needs.repository-security.result }}
          CONTAINER_SECURITY: ${{ needs.container-security.result }}
          SONARCLOUD: ${{ needs.sonarcloud.result }}
          DEPENDENCIES: ${{ needs.dependency-review.result }}
        run: |
          failed=false
          {
            echo '# CI pipeline overview'
            echo
            echo "**Selected scope:** \`${SCOPE:-not available}\`"
            echo
            echo '```mermaid'
            echo 'flowchart LR'
            echo '  A[Change scope] --> B[Repository integrity]'
            echo '  A --> C[Web quality]'
            echo '  A --> D[Matcher correctness]'
            echo '  A --> E[Container resilience]'
            echo '  A --> F[CodeQL and Trivy]'
            echo '  A --> G[Container security]'
            echo '  A --> H[SonarCloud]'
            echo '  A --> I[Dependency review]'
            echo '  B --> J[Quality gate]'
            echo '  C --> J'
            echo '  D --> J'
            echo '  E --> J'
            echo '  F --> J'
            echo '  G --> J'
            echo '  H --> J'
            echo '  I --> J'
            echo '```'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Change detection | $CHANGES |"
            echo "| Repository integrity | $REPOSITORY |"
            echo "| Web quality | $WEB |"
            echo "| Matcher correctness | $MATCHER |"
            echo "| Container recovery | $RUNTIME |"
            echo "| CodeQL security | $SECURITY |"
            echo "| Repository security | $REPOSITORY_SECURITY |"
            echo "| Container security | $CONTAINER_SECURITY |"
            echo "| SonarCloud quality gate | $SONARCLOUD |"
            echo "| Dependency review | $DEPENDENCIES |"
            echo
            echo 'A `skipped` result means that check was not required for this revision or event.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$CHANGES" "$REPOSITORY" "$WEB" "$MATCHER" "$RUNTIME" "$SECURITY" "$REPOSITORY_SECURITY" "$CONTAINER_SECURITY" "$SONARCLOUD" "$DEPENDENCIES"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              failed=true
            fi
          done

          if [ "$failed" = true ]; then
            echo '### Decision: review required' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo '### Decision: ready to merge' >> "$GITHUB_STEP_SUMMARY"
