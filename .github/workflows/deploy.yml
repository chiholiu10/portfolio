name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate deployment credentials
        run: |
          missing=0
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!variable}" ]; then
              echo "::error title=Missing GitHub secret::$variable is required for production deployment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Vercel CLI
        run: npm install --global vercel@65.10.0

      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build deployment artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Stage production artifact without assigning the domain
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staged at $url"

      - name: Install security smoke-test dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Verify deployed HTTPS, headers and API origin policy
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: yarn security:deployment

      - name: Install Chromium for runtime validation
        run: yarn playwright install --with-deps chromium

      - name: Verify deployed browser security behavior
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: yarn security:browser

      - name: Publish the tested artifact to the production domain
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
