version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 3
    groups:
      javascript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /apps/matcher-api
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 3
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
