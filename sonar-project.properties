sonar.projectName=Chiho Liu Portfolio
sonar.sourceEncoding=UTF-8

sonar.sources=apps/web,apps/matcher-api,packages
sonar.tests=apps/web,apps/matcher-api,tests
sonar.exclusions=.github/**,scripts/**,**/*.test.ts,**/test_*.py,**/.next/**,**/.venv/**,**/node_modules/**
sonar.test.inclusions=**/*.test.ts,**/test_*.py,tests/**/*.mjs

sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.coverage.exclusions=apps/matcher-api/**,packages/**,scripts/**
sonar.cpd.exclusions=apps/matcher-api/test_*.py,**/*.test.ts
